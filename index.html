<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#081120"
  />

  <title>지혜의 미로 탐험대</title>
</head>

<body>

  <!-- =========================
       TITLE
  ========================== -->

  <div id="title-screen">

    <div class="title-bg"></div>

    <div class="title-menu">

      <button
        id="start-btn"
        class="main-button"
        type="button"
      >
        ▶ 게임 시작
      </button>

      <button
        id="continue-btn"
        class="main-button"
        type="button"
      >
        이어하기
      </button>

      <button
        id="admin-btn"
        class="main-button"
        type="button"
      >
        교사용 설정
      </button>

      <button
        id="music-btn"
        class="main-button"
        type="button"
      >
        음악 켜기
      </button>

    </div>

  </div>


  <!-- =========================
       GAME
  ========================== -->

  <div
    id="game-screen"
    class="hidden"
  >

    <div id="game-hud">

      <div class="hud-student">
        <strong id="hud-name"></strong>
        <span> · 잠겨버린 교실</span>
      </div>

      <div class="hud-shards">
        말의 조각
        <strong id="hud-shards">
          ◇ ◇ ◇
        </strong>
      </div>

      <div id="hud-objective">
        주변을 조사해 보자.
      </div>

    </div>


    <div id="phaser-root"></div>


    <div id="control-help">
      이동: WASD / 방향키
      &nbsp;·&nbsp;
      조사: E / ENTER / SPACE
    </div>

  </div>


  <!-- =========================
       CHARACTER SETUP
  ========================== -->

  <div
    id="setup-modal"
    class="overlay hidden"
  >

    <div class="panel setup-panel">

      <h2>
        모험가 등록
      </h2>

      <p>
        이름과 캐릭터를 선택해 주세요.
      </p>

      <input
        id="student-name"
        type="text"
        maxlength="12"
        placeholder="이름"
        autocomplete="off"
      />


      <h3>
        캐릭터 선택
      </h3>


      <div class="character-select">

        <button
          class="character-card selected"
          data-gender="male"
          type="button"
        >

          <div
            id="male-preview"
            class="character-preview"
          ></div>

          <strong>
            파란 로브 마법사
          </strong>

        </button>


        <button
          class="character-card"
          data-gender="female"
          type="button"
        >

          <div
            id="female-preview"
            class="character-preview"
          ></div>

          <strong>
            초록 로브 마법사
          </strong>

        </button>

      </div>


      <div class="setup-buttons">

        <button
          id="begin-btn"
          class="big-gold"
          type="button"
        >
          모험 시작
        </button>

        <button
          id="setup-cancel"
          class="text-button"
          type="button"
        >
          돌아가기
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       GAME DIALOG
  ========================== -->

  <div
    id="modal"
    class="overlay hidden"
  >

    <div
      id="modal-panel"
      class="panel"
    >
      <div id="modal-body"></div>
    </div>

  </div>


  <!-- 음악 경로는 main.js에서 설정 -->

  <audio
    id="bgm"
    loop
    preload="auto"
  ></audio>


  <script
    type="module"
    src="/src/main.js"
  ></script>

</body>

</html>
