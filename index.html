<!doctype html>
<html lang="ko">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#0b1020"
  />

  <title>
    지혜의 미로 탐험대
  </title>

</head>


<body>


  <!-- ===================================================
       TITLE SCREEN
  ==================================================== -->

  <main
    id="title-screen"
    class="title-screen"
  >

    <div
      class="title-bg"
      aria-hidden="true"
    ></div>


    <div
      class="title-overlay"
    ></div>


    <section
      class="title-panel"
    >

      <div
        class="title-logo-space"
        aria-hidden="true"
      ></div>


      <div
        class="title-buttons"
      >

        <button
          id="start-btn"
          class="big-gold"
          type="button"
        >
          새 게임
        </button>


        <button
          id="continue-btn"
          class="big-blue"
          type="button"
        >
          이어하기
        </button>


        <button
          id="admin-btn"
          class="text-button"
          type="button"
        >
          교사용 설정
        </button>


        <button
          id="music-btn"
          class="text-button"
          type="button"
        >
          음악 켜기
        </button>

      </div>

    </section>

  </main>



  <!-- ===================================================
       GAME SCREEN
  ==================================================== -->

  <main
    id="game-screen"
    class="game-screen hidden"
  >


    <!-- HUD -->

    <header
      class="game-hud"
    >

      <div
        class="hud-left"
      >

        <span
          class="hud-label"
        >
          플레이어
        </span>

        <strong
          id="hud-name"
          class="hud-value"
        >
        </strong>

      </div>


      <div
        class="hud-center"
      >

        <div
          id="hud-objective"
          class="hud-objective"
        >
          모험을 시작하세요.
        </div>

      </div>


      <div
        class="hud-right"
      >

        <span
          class="hud-label"
        >
          말의 조각
        </span>

        <strong
          id="hud-shards"
          class="hud-shards"
        >
          ◇ ◇ ◇
        </strong>

      </div>

    </header>


    <!-- PHASER -->

    <section
      class="game-stage"
    >

      <div
        id="phaser-root"
      ></div>

    </section>


    <!-- CONTROL HELP -->

    <footer
      class="game-controls"
    >

      <span>
        이동: 방향키 / WASD
      </span>

      <span>
        조사: E / Enter
      </span>

    </footer>


  </main>



  <!-- ===================================================
       NEW GAME / CHARACTER SELECT
  ==================================================== -->

  <div
    id="setup-modal"
    class="screen-modal hidden"
  >

    <div
      class="setup-card"
    >

      <div
        class="setup-header"
      >

        <h2>
          모험가 등록
        </h2>

        <p>
          이름을 입력하고 캐릭터를 선택하세요.
        </p>

      </div>


      <!-- STUDENT NAME -->

      <label
        class="setup-label"
        for="student-name"
      >
        이름
      </label>


      <input
        id="student-name"
        class="setup-input"
        type="text"
        maxlength="20"
        autocomplete="off"
        placeholder="이름을 입력하세요"
      />


      <!-- CHARACTER -->

      <div
        class="setup-label character-select-title"
      >
        캐릭터 선택
      </div>


      <div
        class="character-select"
      >


        <!-- MALE -->

        <button
          class="character-card selected"
          data-gender="male"
          type="button"
        >

          <div
            class="character-portrait-frame"
          >

            <img
              id="male-preview"
              class="character-portrait"
              alt="남자 캐릭터 초상화"
            />

          </div>


          <div
            class="character-name"
          >
            남자 캐릭터
          </div>


          <div
            class="character-check"
            aria-hidden="true"
          >
            ✓
          </div>

        </button>



        <!-- FEMALE -->

        <button
          class="character-card"
          data-gender="female"
          type="button"
        >

          <div
            class="character-portrait-frame"
          >

            <img
              id="female-preview"
              class="character-portrait"
              alt="여자 캐릭터 초상화"
            />

          </div>


          <div
            class="character-name"
          >
            여자 캐릭터
          </div>


          <div
            class="character-check"
            aria-hidden="true"
          >
            ✓
          </div>

        </button>


      </div>


      <!-- BUTTONS -->

      <div
        class="setup-actions"
      >

        <button
          id="setup-cancel"
          class="text-button"
          type="button"
        >
          취소
        </button>


        <button
          id="begin-btn"
          class="big-gold"
          type="button"
        >
          모험 시작
        </button>

      </div>

    </div>

  </div>



  <!-- ===================================================
       DIALOGUE / QUIZ MODAL
  ==================================================== -->

  <div
    id="modal"
    class="game-modal hidden"
  >

    <div
      class="modal-window"
    >

      <div
        id="modal-body"
        class="modal-body"
      >
      </div>

    </div>

  </div>



  <!-- ===================================================
       BGM
  ==================================================== -->

  <audio
    id="bgm"
    loop
    preload="auto"
  ></audio>



  <!-- ===================================================
       VITE ENTRY
  ==================================================== -->

  <script
    type="module"
    src="/src/main.js"
  ></script>


</body>

</html>
